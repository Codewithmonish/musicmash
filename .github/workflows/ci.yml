name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-service:
    name: AI service (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: music-mash-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: music-mash-ai/requirements*.txt
      - name: Install dependencies
        # CPU-only torch first: the default Linux wheel pulls in ~3 GB of CUDA libraries that
        # sentence-transformers doesn't need here.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest==9.1.1
      - name: Run the default test suite
        # No secrets: the LLM and the embeddings are mocked; tests marked slow are skipped (pytest.ini).
        run: python -m pytest -q --durations=10

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: music-mash-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: music-mash-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: music-mash-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        # Unit and contract tests only: no Spring context and no database are started.
        run: mvn -B test
